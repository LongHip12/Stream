<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stream Viewer</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body {
  width: 100%; height: 100%;
  background: #080808;
  font-family: 'Segoe UI', system-ui, sans-serif;
  overflow: hidden;
  color: #fff;
}

/* ── Top bar ───────────────────────────────────────────────────── */
#top-bar {
  position: fixed; top: 0; left: 0; right: 0; height: 46px;
  background: rgba(6,6,6,.95); backdrop-filter: blur(14px);
  border-bottom: 1px solid #1c1c1c;
  display: flex; align-items: center; gap: 12px; padding: 0 16px;
  z-index: 200;
}
#dot {
  width: 9px; height: 9px; border-radius: 50%;
  background: #333; flex-shrink: 0;
  transition: background .4s, box-shadow .4s;
}
#dot.live    { background: #22c55e; box-shadow: 0 0 10px #22c55e88; animation: pulse 2s infinite; }
#dot.offline { background: #ef4444; box-shadow: none; }
@keyframes pulse { 0%,100%{box-shadow:0 0 6px #22c55e55} 50%{box-shadow:0 0 14px #22c55ecc} }

#status-label { font-size: .83rem; color: #aaa; flex: 1; letter-spacing: .02em; }
#badge {
  font-size: .7rem; color: #555;
  background: #111; border: 1px solid #222;
  border-radius: 4px; padding: 2px 8px;
  font-variant-numeric: tabular-nums;
}

/* ── View area ─────────────────────────────────────────────────── */
#view-area {
  position: absolute; inset: 46px 0 0 0;
  display: flex; align-items: center; justify-content: center;
}

/* MJPEG primary — always shown when streaming */
#mjpeg-img {
  max-width: 100%; max-height: 100%;
  object-fit: contain;
  display: none;
}

/* MSE video — shown when WebM decode succeeds (smoother) */
#stream-video {
  max-width: 100%; max-height: 100%;
  object-fit: contain;
  display: none;
  background: transparent;
}

/* ── Waiting overlay ───────────────────────────────────────────── */
#overlay {
  position: absolute; inset: 0;
  background: #0d0d0d;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  gap: 20px; z-index: 50;
}
#overlay.hidden { display: none; }

.spinner {
  width: 40px; height: 40px;
  border: 3px solid #222;
  border-top-color: #3b82f6;
  border-radius: 50%;
  animation: spin .75s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

#overlay-title  { font-size: 1rem; font-weight: 600; color: #ccc; }
#overlay-sub    { font-size: .82rem; color: #666; text-align: center; max-width: 260px; line-height: 1.6; }
#retry-btn {
  display: none;
  padding: 8px 20px; border: 1px solid #2a2a2a; border-radius: 7px;
  background: #111; color: #888; font-size: .82rem; cursor: pointer;
}
#retry-btn:hover { background: #1a1a1a; color: #bbb; }

/* footer link */
#footer-link {
  position: fixed; bottom: 12px; right: 14px;
  font-size: .7rem; color: #2a2a2a; text-decoration: none;
}
#footer-link:hover { color: #555; }
</style>
</head>
<body>

<div id="top-bar">
  <div id="dot"></div>
  <span id="status-label">Đang kết nối...</span>
  <span id="badge" style="display:none"></span>
</div>

<div id="view-area">
  <!-- MJPEG: luôn hoạt động, supported mọi browser -->
  <img id="mjpeg-img" alt="" />
  <!-- MSE video: VP8/VP9, mượt hơn nếu browser hỗ trợ -->
  <video id="stream-video" autoplay muted playsinline></video>

  <!-- Overlay khi chưa có stream -->
  <div id="overlay">
    <div class="spinner"></div>
    <div id="overlay-title">Chờ streamer...</div>
    <div id="overlay-sub">Mở <strong style="color:#aaa">lonelyhubstreaming.onrender.com</strong> trên máy streamer rồi nhấn Bắt đầu Stream</div>
    <button id="retry-btn" onclick="location.reload()">Thử lại</button>
  </div>
</div>

<a id="footer-link" href="/" target="_blank">← Streamer</a>

<script>
const BASE       = location.protocol === 'file:'
  ? 'https://lonelyhubstreaming.onrender.com'
  : location.origin;
const WS_BASE    = BASE.replace(/^https/, 'wss').replace(/^http/, 'ws');
const STATUS_URL = BASE + '/api/status';
const MJPEG_URL  = BASE + '/api/stream';
const WS_URL     = WS_BASE + '/ws?role=viewer';

// ── DOM ──────────────────────────────────────────────────────────
const dot          = document.getElementById('dot');
const statusLabel  = document.getElementById('status-label');
const badge        = document.getElementById('badge');
const overlay      = document.getElementById('overlay');
const overlayTitle = document.getElementById('overlay-title');
const overlaySub   = document.getElementById('overlay-sub');
const retryBtn     = document.getElementById('retry-btn');
const mjpegImg     = document.getElementById('mjpeg-img');
const streamVideo  = document.getElementById('stream-video');

// ── State ─────────────────────────────────────────────────────────
let ws            = null;
let connected     = false;
let mseReady      = false;
let mediaSource   = null;
let sourceBuffer  = null;
let chunkQueue    = [];
let bytesRx       = 0;
let mseCodec      = null;

const hasMSE = typeof MediaSource !== 'undefined';

// ── Helpers ───────────────────────────────────────────────────────
function showOverlay(title, sub, showRetry = false) {
  overlay.classList.remove('hidden');
  overlayTitle.textContent = title;
  overlaySub.innerHTML     = sub;
  retryBtn.style.display   = showRetry ? '' : 'none';
}
function hideOverlay() { overlay.classList.add('hidden'); }

function setStatus(cls, label) {
  dot.className          = cls;
  statusLabel.textContent = label;
}

// ── MJPEG ─────────────────────────────────────────────────────────
// Primary display method — works on all browsers, no JS needed per frame
function startMjpeg() {
  mjpegImg.style.display = 'block';
  mjpegImg.src = MJPEG_URL + '?t=' + Date.now();

  mjpegImg.onload = () => {
    // First frame loaded — hide overlay if connected
    if (connected) hideOverlay();
  };

  mjpegImg.onerror = () => {
    // Server might be sleeping on Render.com free tier
    setTimeout(() => {
      if (connected) mjpegImg.src = MJPEG_URL + '?t=' + Date.now();
    }, 3000);
  };
}

function stopMjpeg() {
  mjpegImg.src           = '';
  mjpegImg.style.display = 'none';
}

// ── MSE (WebM/VP8/VP9) ────────────────────────────────────────────
// Enhancement: when streamer sends WebM, we use native video codec for smoother playback
function initMSE(codec) {
  if (!hasMSE) return;
  if (!MediaSource.isTypeSupported(codec)) {
    console.log('MSE codec not supported:', codec, '— MJPEG stays');
    return;
  }

  // Clean up previous
  teardownMSE();

  mseCodec    = codec;
  mediaSource = new MediaSource();
  chunkQueue  = [];
  mseReady    = false;

  const url = URL.createObjectURL(mediaSource);
  streamVideo.src = url;

  mediaSource.addEventListener('sourceopen', () => {
    try {
      sourceBuffer = mediaSource.addSourceBuffer(codec);
      sourceBuffer.mode = 'sequence';
    } catch (e) {
      console.warn('SourceBuffer error:', e.message);
      teardownMSE(); // keep MJPEG
      return;
    }

    sourceBuffer.addEventListener('updateend', () => {
      // Trim buffer to prevent memory growth (keep last 20s)
      try {
        if (sourceBuffer.buffered.length) {
          const end   = sourceBuffer.buffered.end(sourceBuffer.buffered.length - 1);
          const start = sourceBuffer.buffered.start(0);
          if (end - start > 22) {
            sourceBuffer.remove(start, end - 15);
            return;
          }
        }
      } catch (_) {}
      drainQueue();
    });

    mseReady = true;
    drainQueue();
  }, { once: true });

  mediaSource.addEventListener('error', () => {
    console.warn('MediaSource error — staying on MJPEG');
    teardownMSE();
  }, { once: true });

  // If video actually starts playing, switch display from MJPEG to video
  streamVideo.addEventListener('playing', () => {
    streamVideo.style.display = 'block';
    mjpegImg.style.display    = 'none'; // hide MJPEG once MSE is confirmed working
    hideOverlay();
  }, { once: true });

  // Timeout: if video hasn't played in 4s, keep MJPEG
  setTimeout(() => {
    if (streamVideo.style.display === 'none' || streamVideo.paused) {
      console.log('MSE timeout — keeping MJPEG');
      teardownMSE();
    }
  }, 4000);
}

function drainQueue() {
  if (!mseReady || !sourceBuffer || sourceBuffer.updating || chunkQueue.length === 0) return;
  try {
    sourceBuffer.appendBuffer(chunkQueue.shift());
    bytesRx += (chunkQueue[0]?.byteLength || 0);
  } catch (e) {
    if (e.name === 'QuotaExceededError') chunkQueue = [];
  }
}

function appendWebm(data) {
  if (!mseReady || !sourceBuffer) {
    if (chunkQueue.length < 120) chunkQueue.push(data); // cap queue
    return;
  }
  chunkQueue.push(data);
  if (!sourceBuffer.updating) drainQueue();
  bytesRx += data.byteLength;
}

function teardownMSE() {
  mseReady = false;
  sourceBuffer = null;
  chunkQueue   = [];
  if (mediaSource) {
    try { if (mediaSource.readyState === 'open') mediaSource.endOfStream(); } catch (_) {}
    mediaSource = null;
  }
  if (streamVideo.src) {
    URL.revokeObjectURL(streamVideo.src);
    streamVideo.src     = '';
    streamVideo.style.display = 'none';
  }
  // Restore MJPEG
  if (connected) {
    mjpegImg.style.display = 'block';
    if (!mjpegImg.src || mjpegImg.src === location.href) startMjpeg();
  }
}

// ── Connected / Disconnected ──────────────────────────────────────
function onConnected() {
  connected = true;
  setStatus('live', 'LIVE');
  badge.style.display = '';
  // Start MJPEG immediately — guaranteed visible
  startMjpeg();
  // Overlay will hide on first MJPEG frame load (mjpegImg.onload)
  // If MJPEG loads but MSE also works → switches to MSE (smoother)
}

function onDisconnected() {
  connected = false;
  setStatus('offline', 'Streamer ngoại tuyến');
  badge.style.display = 'none';
  stopMjpeg();
  teardownMSE();
  showOverlay(
    'Streamer đã ngắt kết nối',
    'Sẽ tự kết nối lại khi streamer online'
  );
}

// ── WebSocket ─────────────────────────────────────────────────────
function connectWS() {
  if (ws) { try { ws.close(); } catch (_) {} ws = null; }

  ws = new WebSocket(WS_URL);
  ws.binaryType = 'arraybuffer';

  ws.onopen = () => {
    setStatus('', 'Đang chờ stream...');
  };

  ws.onmessage = (e) => {
    if (typeof e.data === 'string') {
      try {
        const msg = JSON.parse(e.data);
        if (msg.type === 'status') {
          if (msg.connected && !connected) onConnected();
          else if (!msg.connected && connected) onDisconnected();
        } else if (msg.type === 'codec' && hasMSE) {
          // Streamer is sending WebM — try to upgrade from MJPEG to MSE
          initMSE(msg.value);
        }
      } catch (_) {}
      return;
    }

    // Binary WebM chunk
    if (e.data instanceof ArrayBuffer && mseCodec) {
      appendWebm(e.data);
    }
  };

  ws.onclose = () => {
    setTimeout(connectWS, 2000);
  };
  ws.onerror = () => { try { ws.close(); } catch (_) {} };
}

// ── Stats ──────────────────────────────────────────────────────────
let prevBytes = 0;
setInterval(() => {
  if (!connected) return;
  const kbps = Math.round((bytesRx - prevBytes) * 8 / 1000);
  badge.textContent = kbps > 0 ? kbps + ' kbps' : 'buffering...';
  prevBytes = bytesRx;
}, 1000);

// ── Poll status (backup, catches missed WS messages) ──────────────
setInterval(async () => {
  try {
    const r = await fetch(STATUS_URL, { cache: 'no-store' });
    if (!r.ok) return;
    const d = await r.json();
    if (d.connected && !connected) onConnected();
    else if (!d.connected && connected) onDisconnected();
  } catch (_) {}
}, 4000);

// ── Boot ──────────────────────────────────────────────────────────
showOverlay('Đang kết nối...', 'Đang kết nối tới server...');
connectWS();

// Quick initial status check
fetch(STATUS_URL, { cache: 'no-store' })
  .then(r => r.json())
  .then(d => {
    if (d.connected) onConnected();
    else showOverlay(
      'Chờ streamer...',
      'Mở <strong style="color:#ccc">trang chủ</strong> trên máy streamer rồi nhấn <strong style="color:#ccc">Bắt đầu Stream</strong>'
    );
  })
  .catch(() => showOverlay('Không kết nối được server', 'Kiểm tra kết nối mạng', true));
</script>
</body>
</html>
