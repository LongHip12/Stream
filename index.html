<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Screen Stream</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: #0d0d0d;
  color: #f0f0f0;
  font-family: 'Segoe UI', system-ui, sans-serif;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 18px;
  padding: 20px;
}

h1 { font-size: 1.7rem; font-weight: 700; letter-spacing: 0.04em; color: #fff; }

#status-bar {
  display: flex;
  align-items: center;
  gap: 10px;
  font-size: 0.9rem;
  color: #888;
}
#dot {
  width: 10px; height: 10px;
  border-radius: 50%;
  background: #333;
  transition: background 0.3s, box-shadow 0.3s;
  flex-shrink: 0;
}
#dot.live { background: #22c55e; box-shadow: 0 0 8px #22c55e99; }
#dot.error { background: #ef4444; }

#preview-wrap {
  position: relative;
  width: 720px;
  max-width: 95vw;
  aspect-ratio: 16/9;
  background: #0a0a0a;
  border: 1px solid #1e1e1e;
  border-radius: 10px;
  overflow: hidden;
  display: flex;
  align-items: center;
  justify-content: center;
}
#preview {
  width: 100%; height: 100%;
  object-fit: contain;
  display: none;
  background: #000;
}
#placeholder {
  font-size: 0.88rem;
  color: #3a3a3a;
  text-align: center;
  line-height: 2;
  padding: 20px;
  user-select: none;
}
#placeholder .pick { color: #555; font-size: 0.95rem; font-weight: 600; }
#placeholder .ios-note {
  display: none;
  margin-top: 8px;
  font-size: 0.78rem;
  color: #6b4a00;
  background: #1e1400;
  border: 1px solid #3d2a00;
  border-radius: 6px;
  padding: 6px 12px;
  line-height: 1.5;
}

/* ── Mode tabs ────────────────────────────────────────────────── */
#mode-tabs {
  display: flex;
  background: #111;
  border: 1px solid #222;
  border-radius: 10px;
  padding: 4px;
  gap: 4px;
}
.mode-tab {
  padding: 9px 22px;
  border: none;
  border-radius: 7px;
  font-size: 0.9rem;
  font-weight: 600;
  cursor: pointer;
  background: transparent;
  color: #555;
  transition: background 0.2s, color 0.2s;
  display: flex;
  align-items: center;
  gap: 7px;
}
.mode-tab.active {
  background: #1e1e1e;
  color: #e0e0e0;
}
.mode-tab:disabled { opacity: 0.35; cursor: not-allowed; }
.mode-tab svg { flex-shrink: 0; }

/* ── Action buttons ───────────────────────────────────────────── */
#controls {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
  justify-content: center;
}
.action-btn {
  padding: 11px 26px;
  border: none;
  border-radius: 8px;
  font-size: 0.95rem;
  font-weight: 600;
  cursor: pointer;
  transition: opacity 0.2s, transform 0.1s;
}
.action-btn:active { transform: scale(0.97); }
.action-btn:disabled { opacity: 0.35; cursor: not-allowed; transform: none; }
#btn-start { background: #3b82f6; color: #fff; }
#btn-switch-cam {
  display: none;
  background: #1e3a1e;
  color: #4ade80;
  border: 1px solid #2a4a2a;
}
#btn-stop { background: #1e1e1e; color: #888; border: 1px solid #2a2a2a; }

#info {
  font-size: 0.75rem;
  color: #333;
  text-align: center;
  line-height: 1.8;
}
#info a { color: #2563eb; text-decoration: none; }
#info a:hover { color: #3b82f6; }
#fps-badge {
  display: inline-block;
  padding: 2px 8px;
  background: #1a1a1a;
  border-radius: 4px;
  font-size: 0.72rem;
  color: #444;
  font-variant-numeric: tabular-nums;
}
</style>
</head>
<body>

<h1>Screen Stream</h1>

<div id="status-bar">
  <div id="dot"></div>
  <span id="status-text">Chưa kết nối</span>
  <span id="fps-badge" style="display:none"></span>
</div>

<div id="preview-wrap">
  <video id="preview" autoplay muted playsinline></video>
  <div id="placeholder">
    <div class="pick">Chọn chế độ rồi nhấn Bắt đầu</div>
    <div style="margin-top:6px; color:#2a2a2a">
      Screen: chia sẻ màn hình &nbsp;|&nbsp; Camera: dùng webcam/cam điện thoại
    </div>
    <div class="ios-note" id="ios-note">
      ⚠️ iOS Safari không hỗ trợ chia sẻ màn hình qua trình duyệt.<br>
      Chỉ có thể dùng chế độ Camera trên iPhone/iPad.
    </div>
  </div>
</div>

<!-- Mode tabs -->
<div id="mode-tabs">
  <button class="mode-tab active" id="tab-screen" data-mode="screen">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8M12 17v4"/></svg>
    Màn hình
  </button>
  <button class="mode-tab" id="tab-camera" data-mode="camera">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M23 7l-7 5 7 5V7z"/><rect x="1" y="5" width="15" height="14" rx="2"/></svg>
    Camera
  </button>
</div>

<!-- Action buttons -->
<div id="controls">
  <button class="action-btn" id="btn-start">Bắt đầu Stream</button>
  <button class="action-btn" id="btn-switch-cam">🔄 Đổi cam</button>
  <button class="action-btn" id="btn-stop" disabled>Dừng Stream</button>
</div>

<div id="info">
  Server: <span id="server-url"></span> &nbsp;·&nbsp;
  Viewer: <a href="/viewer" target="_blank">/viewer</a>
</div>

<script>
const BASE = location.protocol === 'file:'
  ? 'https://lonelyhubstreaming.onrender.com'
  : location.origin;
const WS_URL = BASE.replace(/^https/, 'wss').replace(/^http/, 'ws') + '/ws';

document.getElementById('server-url').textContent = BASE;

// ── DOM refs ─────────────────────────────────────────────────────
const video        = document.getElementById('preview');
const placeholder  = document.getElementById('placeholder');
const dot          = document.getElementById('dot');
const statusText   = document.getElementById('status-text');
const fpsBadge     = document.getElementById('fps-badge');
const btnStart     = document.getElementById('btn-start');
const btnSwitchCam = document.getElementById('btn-switch-cam');
const btnStop      = document.getElementById('btn-stop');
const iosNote      = document.getElementById('ios-note');
const tabScreen    = document.getElementById('tab-screen');
const tabCamera    = document.getElementById('tab-camera');

// ── State ────────────────────────────────────────────────────────
let mode          = 'screen';   // 'screen' | 'camera'
let ws            = null;
let captureStream = null;
let frameLoop     = null;
let running       = false;

let cameraDevices    = [];      // list of videoInput devices
let cameraIndex      = 0;       // which device is active
let frameCount       = 0;
let lastFpsTime      = performance.now();
let lastFrameTime    = 0;

const TARGET_FPS  = 30;
const FRAME_MS    = 1000 / TARGET_FPS;
const JPEG_Q      = 0.82;

// ── iOS detection ─────────────────────────────────────────────────
const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) ||
              (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
const hasDisplayMedia = !!(navigator.mediaDevices?.getDisplayMedia);

// On iOS, warn screen tab won't work
if (isIOS) {
  iosNote.style.display = 'block';
  // Pre-select camera on iOS
  tabCamera.click();
}

// ── Canvas ────────────────────────────────────────────────────────
const canvas = document.createElement('canvas');
const ctx    = canvas.getContext('2d');

// ── Helpers ───────────────────────────────────────────────────────
function setStatus(cls, msg) {
  dot.className    = cls;
  statusText.textContent = msg;
}

function setLive(isLive) {
  btnStart.disabled = isLive;
  btnStop.disabled  = !isLive;
  tabScreen.disabled = isLive;
  tabCamera.disabled = isLive;
  fpsBadge.style.display = isLive ? '' : 'none';
  btnSwitchCam.style.display = (isLive && mode === 'camera') ? '' : 'none';
}

// ── Mode tabs ─────────────────────────────────────────────────────
[tabScreen, tabCamera].forEach(tab => {
  tab.addEventListener('click', () => {
    if (running) return;
    mode = tab.dataset.mode;
    tabScreen.classList.toggle('active', mode === 'screen');
    tabCamera.classList.toggle('active', mode === 'camera');
    iosNote.style.display = (isIOS && mode === 'screen') ? 'block' : 'none';
  });
});

// ── Enumerate cameras ─────────────────────────────────────────────
async function loadCameraList() {
  try {
    const devices = await navigator.mediaDevices.enumerateDevices();
    cameraDevices = devices.filter(d => d.kind === 'videoinput');
  } catch (_) { cameraDevices = []; }
}

// ── Acquire stream ────────────────────────────────────────────────
async function acquireStream() {
  if (mode === 'screen') {
    // Screen capture — works on PC + Android Chrome
    return navigator.mediaDevices.getDisplayMedia({
      video: {
        frameRate: { ideal: 30, max: 30 },
        width:     { ideal: 1280 },
        height:    { ideal: 720 },
        cursor:    'always'
      },
      audio: false
    });
  } else {
    // Camera
    await loadCameraList();
    cameraIndex = 0;

    // Try to find rear camera first on mobile
    const rearIdx = cameraDevices.findIndex(d =>
      /back|rear|environment/i.test(d.label)
    );
    if (rearIdx !== -1) cameraIndex = rearIdx;

    return getCameraStream(cameraIndex);
  }
}

async function getCameraStream(idx) {
  const constraints = { audio: false };
  if (cameraDevices.length > 0 && cameraDevices[idx]) {
    constraints.video = {
      deviceId: { exact: cameraDevices[idx].deviceId },
      frameRate: { ideal: 30 },
      width:     { ideal: 1280 },
      height:    { ideal: 720 }
    };
  } else {
    constraints.video = {
      facingMode: { ideal: 'environment' },
      frameRate:  { ideal: 30 },
      width:      { ideal: 1280 },
      height:     { ideal: 720 }
    };
  }
  return navigator.mediaDevices.getUserMedia(constraints);
}

// ── Send frame over WS ────────────────────────────────────────────
function sendFrame() {
  if (!ws || ws.readyState !== WebSocket.OPEN) return;
  const now = performance.now();
  if (now - lastFrameTime < FRAME_MS - 2) return;
  lastFrameTime = now;

  canvas.width  = video.videoWidth  || 1280;
  canvas.height = video.videoHeight || 720;
  ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

  canvas.toBlob(blob => {
    if (!blob || !ws || ws.readyState !== WebSocket.OPEN) return;
    blob.arrayBuffer().then(buf => {
      if (ws && ws.readyState === WebSocket.OPEN) {
        ws.send(buf);
        frameCount++;
        const elapsed = performance.now() - lastFpsTime;
        if (elapsed >= 1000) {
          fpsBadge.textContent = Math.round(frameCount * 1000 / elapsed) + ' fps';
          frameCount  = 0;
          lastFpsTime = performance.now();
        }
      }
    });
  }, 'image/jpeg', JPEG_Q);
}

// ── WebSocket ─────────────────────────────────────────────────────
function connectWS() {
  if (ws) { ws.close(); ws = null; }
  ws = new WebSocket(WS_URL);
  ws.binaryType = 'arraybuffer';

  ws.addEventListener('open', () => {
    setStatus('live', 'Đang stream · ' + (mode === 'screen' ? 'Màn hình' : 'Camera'));
    running = true;
    setLive(true);
    frameLoop = setInterval(sendFrame, 16);
  });

  ws.addEventListener('close', () => {
    clearInterval(frameLoop);
    if (running) {
      setStatus('error', 'Mất kết nối — thử lại...');
      setTimeout(connectWS, 2000);
    }
  });

  ws.addEventListener('error', () => ws.close());
}

// ── Switch camera mid-stream ──────────────────────────────────────
btnSwitchCam.addEventListener('click', async () => {
  if (!running || mode !== 'camera') return;
  await loadCameraList();
  if (cameraDevices.length <= 1) {
    setStatus('live', 'Chỉ có 1 camera');
    return;
  }

  cameraIndex = (cameraIndex + 1) % cameraDevices.length;
  btnSwitchCam.disabled = true;

  try {
    // Stop old tracks
    if (captureStream) captureStream.getTracks().forEach(t => t.stop());

    captureStream = await getCameraStream(cameraIndex);
    video.srcObject = captureStream;
    captureStream.getVideoTracks()[0].addEventListener('ended', cleanup);

    const label = cameraDevices[cameraIndex]?.label || `Cam ${cameraIndex + 1}`;
    setStatus('live', 'Camera: ' + label.slice(0, 30));
  } catch (e) {
    setStatus('error', 'Không thể đổi camera: ' + (e.message || e.name));
  }
  btnSwitchCam.disabled = false;
});

// ── Start ─────────────────────────────────────────────────────────
btnStart.addEventListener('click', async () => {
  if (!navigator.mediaDevices) {
    setStatus('error', 'Cần HTTPS để dùng camera/màn hình');
    return;
  }

  setStatus('', 'Đang yêu cầu quyền...');

  try {
    captureStream = await acquireStream();
  } catch (e) {
    if (e.name === 'NotAllowedError') {
      setStatus('error', 'Đã từ chối — nhấn lại để thử lại');
    } else if (e.name === 'NotSupportedError' || !hasDisplayMedia && mode === 'screen') {
      setStatus('error', 'Trình duyệt không hỗ trợ chia sẻ màn hình — thử chế độ Camera');
      iosNote.style.display = 'block';
    } else if (e.name === 'NotFoundError') {
      setStatus('error', 'Không tìm thấy camera');
    } else {
      setStatus('error', e.message || e.name || 'Lỗi không xác định');
    }
    return;
  }

  captureStream.getVideoTracks()[0].addEventListener('ended', cleanup);
  video.srcObject    = captureStream;
  video.style.display   = 'block';
  placeholder.style.display = 'none';
  connectWS();
});

// ── Stop ──────────────────────────────────────────────────────────
function cleanup() {
  running = false;
  clearInterval(frameLoop); frameLoop = null;
  if (ws) { ws.close(); ws = null; }
  if (captureStream) { captureStream.getTracks().forEach(t => t.stop()); captureStream = null; }
  video.srcObject = null;
  video.style.display   = 'none';
  placeholder.style.display = '';
  setStatus('', 'Stream đã dừng');
  setLive(false);
}

btnStop.addEventListener('click', cleanup);
</script>
</body>
</html>
